<script>
const $=i=>document.getElementById(i),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],gcd=(a,b)=>b?gcd(b,a%b):a;
const xt=c=>(c<0?'−':'+')+(Math.abs(c)==1?'':Math.abs(c))+'x',sg=n=>n<0?'−'+-n:'+'+n,f=n=>String(n).replace('-','−'),nz=()=>pick([-4,-3,-2,-1,1,2,3,4]),sf=x=>+x.toPrecision(3);
const nm=s=>s.toLowerCase().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/³/g,'^3').replace(/²/g,'^2').replace(/sqrt\(?(\d+)\)?/g,'√$1').replace(/^\+/,'').replace(/\*/g,'');
const num=s=>{s=s.replace(/\s/g,'').replace('−','-');const m=s.match(/^(-?[\d.]+)\/([\d.]+)$/);return m?m[1]/m[2]:parseFloat(s)};
const poly=cs=>cs.map((c,i)=>[c,['x³','x²','x',''].slice(4-cs.length)[i]]).filter(([c])=>c).map(([c,v],i)=>(c<0?'−':i?'+':'')+(Math.abs(c)==1&&v?'':Math.abs(c))+v).join('');
/* figures */
const BX=v=>20+(v-150)*6.4;
function box(rows){const h=rows.length*52+44;let s=`<svg viewBox="0 0 360 ${h}" class="fig">`;
for(let v=150;v<=200;v+=5){const x=BX(v);s+=`<line x1="${x}" x2="${x}" y1="4" y2="${h-34}" class="g"/><text x="${x}" y="${h-22}" class="tx" text-anchor="middle">${v}</text>`}
rows.forEach((r,i)=>{const y=24+i*52,[a,b,c,d,e]=r.v;s+=`<text x="20" y="${y-14}" class="tx">${r.n}</text><path d="M${BX(a)} ${y}H${BX(b)}M${BX(d)} ${y}H${BX(e)}M${BX(a)} ${y-8}V${y+8}M${BX(e)} ${y-8}V${y+8}" class="l"/><rect x="${BX(b)}" y="${y-12}" width="${BX(d)-BX(b)}" height="24" class="bx"/><path d="M${BX(c)} ${y-12}V${y+12}" class="l"/>`});
return s+`<text x="180" y="${h-6}" class="tx" text-anchor="middle">Height (cm)</text></svg>`}
function hist(bars){const X=v=>40+v*4.4,Y=q=>190-q*50;let s=`<svg viewBox="0 0 360 230" class="fig">`;
for(let q=0;q<=3.5;q+=.5)s+=`<line x1="40" x2="348" y1="${Y(q)}" y2="${Y(q)}" class="g"/><text x="35" y="${Y(q)+3}" class="tx" text-anchor="end">${q}</text>`;
for(let v=0;v<=70;v+=10)s+=`<line x1="${X(v)}" x2="${X(v)}" y1="15" y2="190" class="g"/><text x="${X(v)}" y="203" class="tx" text-anchor="middle">${v}</text>`;
bars.forEach(b=>s+=`<rect x="${X(b[0])}" y="${Y(b[2])}" width="${X(b[1])-X(b[0])}" height="${190-Y(b[2])}" class="${b[3]?'bn':'bx'}"/>`);
return s+`<text x="194" y="222" class="tx" text-anchor="middle">Distance travelled to school (km)</text><text transform="translate(9 110) rotate(-90)" class="tx" text-anchor="middle">Frequency density</text></svg><p class="tx" style="font-size:12px;color:var(--m)">Green bar = the bar you add.</p>`}
/* lessons */
const fr=[9,11,8,15,10,14,12,21];
const Q=[
{n:10,m:4,p:'prob',q:`<p>A biased spinner with 8 equal-sized sections numbered 1 to 8 is spun 100 times. The table shows the results.</p><table><tr><th>Number</th>${fr.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr><tr><th>Frequency</th>${fr.map(x=>`<td>${x}</td>`).join('')}</tr></table><p><b>(a)</b> Gethin spins the spinner twice. Work out an estimate for the probability that the spinner lands on 8 both times. (3)</p><p><b>(b)</b> Sally is going to spin the same spinner many more times and use her results to work out a more reliable estimate for the probability in part (a). Explain how increasing the number of spins affects the reliability of the estimate. (1)</p>`,
s:[`<b>(a)</b> P(8) = 21/100 = 0.21 (frequency of 8 ÷ total spins).`,`<b>(a)</b> Two independent spins, so multiply: 0.21 × 0.21 = 0.0441 (= 441/10000).`,`<b>(b)</b> More spins make the estimate <b>more reliable</b> (closer to the true probability).`],a:`(a) 0.0441 (b) more spins → a more reliable estimate`,t:`“The more you spin the more chances you have of getting the 8” would not earn the mark. It must talk about the estimate being more reliable/accurate.`},
{n:11,m:4,p:'simul',q:`<p>Use algebra to solve the simultaneous equations</p><p>4x + 3y = 25<br>2x − 3y = −1</p>`,s:[`The y terms are +3y and −3y, so add the equations: 6x = 24.`,`x = 4.`,`Substitute into 4x + 3y = 25: 16 + 3y = 25, so 3y = 9 and y = 3.`,`Check in 2x − 3y: 8 − 9 = −1 ✓`],a:`x = 4, y = 3`},
{n:12,m:4,p:'circ',q:`<p>The points A, B, C and D lie on a circle, centre O. ABCD is a rectangle. AB = 6 cm, BC = 8 cm.</p><p>Work out the circumference of the circle. Give your answer correct to 3 significant figures. (4)</p>`,s:[`The diagonal AC of the rectangle passes through O, so it is a diameter.`,`Pythagoras: AC² = 6² + 8² = 36 + 64 = 100, so AC = 10 cm.`,`Circumference = π × d = 10 × π = 31.4159…`,`= 31.4 cm (3 s.f.)`],a:`31.4 cm`,t:`The student’s working is right so far. Finish with 10 × π = 31.4 and say the diagonal is the diameter.`},
{n:13,m:3,p:'expand',q:`<p>Show that (x + 2)(x − 3)(x + 1) can be written in the form ax³ + bx² + cx + d, where a, b, c and d are integers. (3)</p>`,s:[`(x + 2)(x − 3) = x² − 3x + 2x − 6 = x² − x − 6.`,`(x² − x − 6)(x + 1) = x³ + x² − x² − x − 6x − 6.`,`= x³ − 7x − 6, so a = 1, b = 0, c = −7, d = −6.`],a:`x³ − 7x − 6`,t:`The student’s working gives x³ − 7x − 6, which is correct. Finish by stating a, b, c, d are integers.`},
{n:14,m:3,p:'frac',q:`<p>Show that (x² + 2x − 8)/(2x² − 3x − 2) can be written in the form (ax + b)/(cx + d), where a, b, c and d are integers. (3)</p>`,s:[`<b>Numerator</b> x² + 2x − 8: a × c = 1 × (−8) = −8.`,`Find two numbers that multiply to −8 and add to +2: they are +4 and −2.`,`Split the middle term: x² + 4x − 2x − 8.`,`Factorise in pairs: x(x + 4) − 2(x + 4) = (x − 2)(x + 4).`,`<b>Denominator</b> 2x² − 3x − 2: a × c = 2 × (−2) = −4.`,`Find two numbers that multiply to −4 and add to −3: they are −4 and +1.`,`Split the middle term: 2x² − 4x + x − 2.`,`Factorise in pairs: 2x(x − 2) + 1(x − 2) = (2x + 1)(x − 2). Check by expanding: 2x² − 4x + x − 2 ✓`,`Write the fraction with the factors: (x + 4)(x − 2) / (2x + 1)(x − 2).`,`Cancel the common factor (x − 2): (x + 4)/(2x + 1).`,`So a = 1, b = 4, c = 2, d = 1.`],a:`(x + 4)/(2x + 1)`},
{n:15,m:3,q:`<p>The table shows information about the heights of a sample of adult swimmers (Group A).</p><table><tr><td>least height</td><td>155 cm</td></tr><tr><td>greatest height</td><td>190 cm</td></tr><tr><td>median</td><td>170 cm</td></tr><tr><td>lower quartile</td><td>161 cm</td></tr><tr><td>upper quartile</td><td>178 cm</td></tr></table><p><b>(a)</b> On the grid, draw a box plot for the information in the table. (3)</p>`,s:[`<b>(a)</b> Whiskers: draw from 155 to the box and from the box to 190.`,`The box runs from the lower quartile (161) to the upper quartile (178).`,`Draw a vertical line inside the box at the median (170). Solution drawn below.`],a:`Box 161–178, median 170, whiskers 155 and 190`,fg:()=>box([{n:'Group A',v:[155,161,170,178,190]}])},
{n:16,m:2,q:`<p>The box plot shows the heights of adult marathon runners (Group B). Compare the distribution of the heights of the swimmers (Group A) with the distribution of the heights of the marathon runners (Group B). (2)</p>`,s:[`Read Group B: min ≈ 155, LQ ≈ 163, median ≈ 168, UQ ≈ 174, max ≈ 188 (estimated from the photo, so check against the printed plot).`,`<b>Average:</b> Group A’s median (170 cm) is higher than Group B’s (about 168 cm).`,`<b>Spread:</b> Group A’s IQR is 178 − 161 = 17 cm, bigger than Group B’s (about 11 cm), so Group A’s heights are more spread out.`],a:`Compare one average (median) and one spread (IQR or range), in context.`,t:`Always use the words “median” or “IQR”, and refer to the groups by name.`,fg:()=>box([{n:'Group A',v:[155,161,170,178,190]},{n:'Group B (approx.)',v:[155,163,168,174,188]}])},
{n:17,m:4,p:'hist',q:`<p>The histogram gives information about the distances travelled to school by some students. The histogram is incomplete. 27 students travelled between 35 km and 50 km.</p><p><b>(a)</b> Use this information to complete the histogram. (2)</p><p><b>(b)</b> Work out the total number of students. (2)</p>`,s:[`<b>(a)</b> Frequency density = frequency ÷ class width. The 35–50 bar has width 15 and frequency 27, so FD = 27 ÷ 15 = 1.8. Draw the bar from 35 to 50 at height 1.8.`,`<b>(b)</b> To find the total, work out the frequency of each bar (frequency = FD × class width), then add them up.`,`0–20: 1.5 × 20 = 30`,`20–35: 3.0 × 15 = 45 (the tall bar ends at 35, not 30)`,`35–50: 27`,`50–70: 0.9 × 20 = 18`,`Total number of students = 30 + 45 + 27 + 18 = 120.`],a:`(a) bar from 35 to 50 at height 1.8 (b) 120`,fg:()=>hist([[0,20,1.5],[20,35,3],[35,50,1.8,1],[50,70,0.9]])},
{n:18,m:5,p:'frust',q:`<p>A solid frustum is made by removing a small cone from a large cone, as shown in the diagram. The slant height of the large cone is 15 cm. The slant height of the small cone is 6 cm. The base of the large cone is labelled 10 cm across in the diagram, so its diameter is 10 cm and its radius is 5 cm. (Curved surface area of a cone = πrl)</p><p>Calculate the total surface area of the frustum. Give your answer correct to 3 significant figures. (5)</p>`,s:[`Base diameter 10 cm, so the large radius is 5 cm. Small cone radius, by similar shapes: r = 5 × 6/15 = 2 cm.`,`Large cone curved area = π × 5 × 15 = 75π. Small cone curved area = π × 2 × 6 = 12π.`,`Curved surface of frustum = 75π − 12π = 63π.`,`Add the two flat circles (it is solid): bottom π × 5² = 25π, top π × 2² = 4π.`,`Total = 63π + 25π + 4π = 92π = 289.03… ≈ 289 cm².`],a:`289 cm²`,t:`Common mistakes: using 10 as the radius instead of the diameter, or forgetting the top circle.`},
{n:19,m:3,p:'ratio',q:`<p>2a = 3c and 5b = 4c.</p><p>Show that a + b : b + c = 23 : 18 (3)</p>`,s:[`Write a and b in terms of c: a = 3c/2 and b = 4c/5.`,`Pick a value of c that clears both denominators, c = 10: a = 15 and b = 8.`,`a + b = 23 and b + c = 8 + 10 = 18.`,`So a + b : b + c = 23 : 18 ✓`],a:`23 : 18`},
{n:20,m:3,p:'bnd',q:`<p>ABC is a right-angled triangle (right angle at B). AB = 7.6 cm correct to the nearest mm. AC = 11.4 cm correct to the nearest mm.</p><p>Calculate the lower bound for the size of the angle marked x (at C). You must show all your working. (3)</p>`,s:[`Nearest mm means ±0.05 cm: 7.55 ≤ AB &lt; 7.65 and 11.35 ≤ AC &lt; 11.45.`,`x is opposite AB and AC is the hypotenuse, so sin x = AB/AC.`,`Smallest angle: smallest AB over largest AC: sin x = 7.55/11.45.`,`x = sin⁻¹(7.55/11.45) = 41.25…° ≈ 41.3°.`],a:`41.3°`},
{n:21,m:3,p:'rec',q:`<p>Prove algebraically that the recurring decimal 0.345454545… (where the digits “45” recur forever) can be written as the fraction 19/55. (3)</p>`,s:[`Let x = 0.3454545…`,`Multiply by 1000 and by 10 so the recurring parts line up: 1000x = 345.454545… and 10x = 3.454545…`,`Subtract: 990x = 342.`,`x = 342/990 = 19/55 (divide top and bottom by 18) ✓`],a:`x = 19/55`},
{n:22,m:5,p:'surd2',q:`<p>The diagram shows a square with a smaller square cut from one corner. The large square has side length (3 + √5) cm. The small square that is removed has side length (√5 − 1) cm.</p><p>Find the area of the remaining shape. Give your answer in the form a + b√5, where a and b are integers. You must show all your working. (5)</p>`,s:[`Large square: (3 + √5)² = 9 + 3√5 + 3√5 + 5 = 14 + 6√5.`,`Small square: (√5 − 1)² = 5 − √5 − √5 + 1 = 6 − 2√5.`,`Remaining area = (14 + 6√5) − (6 − 2√5) = 8 + 8√5.`],a:`8 + 8√5 cm²`},
{n:23,m:2,p:'surd1',q:`<p>Simplify √12 + √27, giving your answer in the form k√3, where k is an integer. (2)</p>`,s:[`√12 = √(4 × 3) = 2√3.`,`√27 = √(9 × 3) = 3√3.`,`2√3 + 3√3 = 5√3.`],a:`5√3`},
{n:24,m:3,p:'expand',q:`<p>Expand and simplify (2x − 1)(x + 3)(x − 2), writing your answer in the form ax³ + bx² + cx + d, where a, b, c and d are integers. (3)</p>`,s:[`(x + 3)(x − 2) = x² − 2x + 3x − 6 = x² + x − 6.`,`(2x − 1)(x² + x − 6) = 2x³ + 2x² − 12x − x² − x + 6.`,`Collect like terms: 2x³ + x² − 13x + 6.`],a:`2x³ + x² − 13x + 6`}];
let cur=10;
function chips(){$('chips').innerHTML=Q.map(q=>`<button class="${q.n==cur?'on':''}" onclick="show(${q.n})">Q${q.n}</button>`).join('')}
function show(n){cur=n;chips();const q=Q.find(x=>x.n==n);$('card').innerHTML=`<h2>Question ${n} <span class="tag">${q.m} marks</span></h2><div class="ex">${q.q}${q.fg?q.fg():''}</div><h3>Worked solution</h3><ol>${q.s.map(x=>`<li>${x}</li>`).join('')}</ol><div class="ans">Answer: ${q.a}</div>${q.t?`<div class="tip">💡 ${q.t}</div>`:''}${q.p?`<p><button class="btn" onclick="prac('${q.p}')">Practice a similar question →</button></p>`:''}`}
/* practice generators */
const G={
prob(){const k=R(12,25),v=k*k/10000;return{q:`A biased spinner is spun 100 times and lands on 8 exactly ${k} times. Estimate the probability that it lands on 8 on both of two spins.`,a:`${k*k}/10000 = ${v}`,c:s=>Math.abs(num(s)-v)<1e-9,st:[`P(8) = ${k}/100`,`Both spins: ${k}/100 × ${k}/100 = ${k*k}/10000 = ${v}`]}},
simul(){const x=R(2,6),y=R(1,5),p=R(2,5),r=R(1,4),q=R(2,4),e1=p*x+q*y,e2=r*x-q*y;return{q:`Use algebra to solve<br>${p}x + ${q}y = ${f(e1)}<br>${r}x − ${q}y = ${f(e2)}`,a:`x = ${x}, y = ${y}`,c:s=>{s=nm(s);return s.includes(`x=${x}`)&&s.includes(`y=${y}`)},st:[`Add the equations to cancel y: ${p+r}x = ${e1+e2}`,`x = ${x}`,`Substitute into the first equation: ${p*x} + ${q}y = ${e1}, so y = ${y}`]}},
circ(){const t=pick([[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]]),a=sf(Math.PI*t[2]);return{q:`Points A, B, C, D lie on a circle, centre O. ABCD is a rectangle with AB = ${t[0]} cm and BC = ${t[1]} cm. Work out the circumference of the circle to 3 significant figures.${cir(t[0],t[1])}`,a:`${a} cm`,c:s=>sf(num(s))==a,st:[`AC is a diameter: d = √(${t[0]}² + ${t[1]}²) = ${t[2]}`,`C = π × ${t[2]} = ${(Math.PI*t[2]).toFixed(3)}…`,`= ${a} cm (3 s.f.)`]}},
expand(){const k=R(1,2),m=nz(),p=nz(),q=nz(),c=[k,k*(p+q)+m,k*p*q+m*(p+q),m*p*q],a=poly(c);return{q:`Expand and simplify (${k==1?'':k}x${sg(m)})(x${sg(p)})(x${sg(q)}) in the form ax³ + bx² + cx + d.<br><small>Type like 2x^3 + x^2 − 13x + 6</small>`,a,c:s=>nm(s)==nm(a),st:[`(x${sg(p)})(x${sg(q)}) = ${poly([1,p+q,p*q])}`,`Multiply by (${k==1?'':k}x${sg(m)}) and collect like terms.`,`= ${a}`]}},

const TH={
10:`<ul><li><b>Relative frequency</b> = frequency ÷ total number of trials. It is used as an <b>estimate</b> of probability when outcomes are not equally likely (a biased spinner).</li><li><b>Independent events</b> (one does not affect the other): P(A and B) = P(A) × P(B).</li><li>The more trials, the closer the relative frequency is to the true probability, so the estimate is <b>more reliable</b>.</li></ul>`,
11:`<ul><li><b>Elimination:</b> make the coefficients of one letter the same size (multiply an equation if needed).</li><li>If the matching terms have <b>different signs, add</b> the equations; if the <b>same sign, subtract</b>.</li><li>Solve for one letter, <b>substitute</b> back to find the other, then <b>check</b> in the other equation.</li></ul>`,
12:`<ul><li><b>Pythagoras:</b> a² + b² = c², where c is the hypotenuse.</li><li>The angle in a semicircle is 90°, so the diagonal of a rectangle inside a circle is a <b>diameter</b>.</li><li><b>Circumference</b> C = πd = 2πr.</li><li>3 significant figures: count from the first non-zero digit, then round.</li></ul>`,
13:`<ul><li>Expand brackets by multiplying <b>every term</b> in one bracket by every term in the other.</li><li>For three brackets, expand <b>two first</b>, then multiply the result by the third.</li><li>Collect <b>like terms</b>. Watch the signs: − × − = +, + × − = −.</li><li>“Show that” means show every step of your working.</li></ul>`,
14:`<ul><li><b>Factorising x² + bx + c:</b> find two numbers that multiply to c and add to b.</li><li><b>Factorising ax² + bx + c:</b> multiply a × c, find two numbers that multiply to ac and add to b, split the middle term, then factorise in pairs.</li><li><b>Algebraic fractions:</b> factorise top and bottom, then cancel <b>common factors</b> only (never cancel single terms).</li></ul>`,
15:`<ul><li>A box plot shows the <b>five-number summary</b>: least value, lower quartile (LQ), median, upper quartile (UQ), greatest value.</li><li>Draw a box from LQ to UQ, a vertical line at the median, and <b>whiskers</b> out to the least and greatest values.</li><li>Use a ruler and read the scale carefully.</li><li><b>Interquartile range (IQR)</b> = UQ − LQ</li><li><b>Range</b> = greatest − least</li></ul>`,
16:`<ul><li>To compare distributions, make <b>one comment about average</b> (compare medians) and <b>one about spread</b> (compare IQRs or ranges).</li><li>Use numbers and refer to the groups by name, in context (e.g. “the swimmers are taller on average”).</li><li>A bigger IQR means the middle 50% of the data is more spread out. The IQR is not affected by extreme values.</li></ul>`,
17:`<ul><li><b>Frequency density</b> = frequency ÷ class width.</li><li><b>Frequency</b> = frequency density × class width, which is the <b>area</b> of the bar.</li><li>Use histograms when class widths are unequal. Read the bar heights from the vertical axis.</li><li>Total frequency = sum of all the bar areas.</li></ul>`,
18:`<ul><li><b>Similar shapes</b> have exactly the same shape but different sizes: all the angles are equal and all matching lengths are in the same ratio (the scale factor). A small cone cut off the top of a large cone is similar to the large cone.</li><li><b>Curved surface area of a cone</b> = πrl (l = slant height). <b>Area of a circle</b> = πr².</li><li><b>Using similarity:</b> matching lengths are in the same ratio, so the small cone’s radius = large radius × (small slant ÷ large slant).</li><li>A <b>frustum</b> is a large cone with a small cone removed. Its curved area = large CSA − small CSA.</li><li>A <b>solid</b> frustum also has two flat circles (top and bottom).</li></ul>`,
19:`<ul><li><b>Rearrange</b> each equation to write the letters in terms of one common letter (here c).</li><li>Choose a value for that letter that makes every fraction a whole number.</li><li>A ratio a : b means a ÷ b. Add letters before comparing (a + b), then simplify by dividing by the HCF.</li><li>For “show that”, state both parts and the final ratio clearly.</li></ul>`,
20:`<ul><li><b>Bounds:</b> a value rounded to the nearest unit has an error of ± half a unit. 7.6 to the nearest 0.1 means 7.55 ≤ x &lt; 7.65.</li><li><b>SOHCAHTOA:</b> sin x = opposite ÷ hypotenuse. Find the angle with sin⁻¹.</li><li>For the <b>smallest</b> angle (sine) use the <b>smallest</b> opposite and the <b>largest</b> hypotenuse.</li></ul>`,
21:`<ul><li>Let <b>x</b> = the recurring decimal.</li><li>Multiply by powers of 10 so that the recurring parts line up exactly, then <b>subtract</b> to remove the recurring part.</li><li>Solve for x as a fraction and simplify using the highest common factor.</li></ul>`,
22:`<ul><li><b>Surds:</b> √a × √a = a, and √a × √b = √(ab).</li><li>Expand brackets like (3 + √5)² by writing it out as two brackets (FOIL), then collect the whole numbers and the √5 terms.</li><li><b>Area of a square</b> = side². For a composite shape, subtract the removed area.</li><li>Be careful subtracting a bracket: change all its signs.</li></ul>`,
23:`<ul><li><b>√(ab) = √a × √b.</b> Split into a square number times another number: √12 = √4 × √3 = 2√3.</li><li>Only <b>like surds</b> can be added: 2√3 + 3√3 = 5√3 (like adding 2x + 3x).</li></ul>`,
24:`<ul><li>Expand two brackets first, then multiply the result by the third.</li><li>Multiply every term by every term and collect <b>like terms</b>.</li><li>Take extra care with <b>negative signs</b>, and write the answer from the highest power of x down.</li></ul>`};

const TE={
10:`<h4>The idea</h4><p>If every outcome is equally likely (a fair spinner) you can work out probabilities by counting. If the spinner is <b>biased</b> you cannot, so you <b>estimate</b> by trying it many times. The estimate is the <b>relative frequency</b> = number of times it happened ÷ total number of trials.</p><h4>Two spins in a row</h4><p>The spins are <b>independent</b>: the first spin does not change the second. “Both times” means A <i>and</i> B, so <b>multiply</b> the probabilities.</p><div class="eg"><b>Example:</b> a dice is rolled 200 times and lands on 6 forty-five times. P(6) ≈ 45/200 = 0.225. Two rolls both 6: 0.225 × 0.225 ≈ 0.0506.</div><h4>Why more spins is better</h4><p>With few spins, luck has a big effect. With many spins the random ups and downs even out, so the relative frequency gets closer to the true probability. Write: “more spins gives a <b>more reliable (accurate) estimate</b> that is closer to the true probability.”</p><h4>Common mistakes</h4><p>Writing about “more chances of getting the 8” (that is about outcomes, not reliability). Adding instead of multiplying for “both”. Dividing by 8 instead of by the total number of spins.</p>`,
11:`<h4>The idea</h4><p>Two equations, two unknowns. <b>Elimination</b> removes one letter so you can solve for the other.</p><h4>Method</h4><p>1. Make the numbers in front of one letter match (multiply a whole equation if needed).<br>2. If the matching terms have <b>opposite signs, add</b> the equations. If they have the <b>same sign, subtract</b>.<br>3. Solve for the letter that is left.<br>4. <b>Substitute</b> back to find the other letter.<br>5. <b>Check</b> in the other equation.</p><div class="eg"><b>Example:</b> 5x + 2y = 16 and 3x − 2y = 0. The y terms are +2y and −2y, so add: 8x = 16, x = 2. Substitute: 10 + 2y = 16, so y = 3. Check: 3(2) − 2(3) = 0 ✓<br><b>When nothing matches:</b> 2x + y = 7 and 3x + 2y = 12. Multiply the first by 2: 4x + 2y = 14. Subtract: x = 2, then y = 3.</div><h4>Common mistakes</h4><p>Sign errors when subtracting a negative. Multiplying only one side of an equation. Stopping after finding x.</p>`,
12:`<h4>Pythagoras</h4><p>In a right-angled triangle, a² + b² = c² where c is the longest side (hypotenuse). Add the squares of the two shorter sides, then <b>square root</b>.</p><div class="eg">Sides 5 and 12: 25 + 144 = 169, √169 = 13.</div><h4>Circle fact</h4><p>The angle in a semicircle is 90°. Each corner of the rectangle is 90°, so the diagonal joining opposite corners is a <b>diameter</b> of the circle (it passes through the centre O).</p><h4>Circumference</h4><p>C = π × diameter (or 2 × π × radius). Use the diameter you found, not half of it.</p><div class="eg">Diameter 13: C = 13π = 40.84… = 40.8 (3 s.f.)</div><h4>Significant figures</h4><p>Start counting at the first non-zero digit. 0.004567 to 3 s.f. is 0.00457. Do not round until the very end.</p><h4>Common mistakes</h4><p>Forgetting the square root (answering 100 instead of 10). Using C = πr². Rounding too early.</p>`,
13:`<h4>The idea</h4><p>To expand, multiply <b>every term</b> in one bracket by <b>every term</b> in the next. With three brackets, expand <b>two</b> first, then multiply that answer by the third.</p><div class="eg"><b>Example:</b> (x + 5)(x − 1)(x + 2)<br>Step 1: (x + 5)(x − 1) = x² − x + 5x − 5 = x² + 4x − 5<br>Step 2: (x² + 4x − 5)(x + 2) = x³ + 2x² + 4x² + 8x − 5x − 10<br>Step 3: collect like terms: x³ + 6x² + 3x − 10</div><p>So a = 1, b = 6, c = 3, d = −10, all integers.</p><h4>Signs</h4><p>+ × + = +, − × − = +, + × − = −.</p><h4>Quick check</h4><p>Put x = 1 into the start and the end. (6)(0)(3) = 0 and 1 + 6 + 3 − 10 = 0 ✓</p><h4>Common mistakes</h4><p>Dropping a term, sign slips, and stopping after two brackets. “Show that” needs every step written down.</p>`,
14:`<h4>Factorising a quadratic: the a × c method</h4><p>For ax² + bx + c:<br>1. Multiply <b>a × c</b>.<br>2. Find two numbers that <b>multiply to ac</b> and <b>add to b</b>.<br>3. <b>Split the middle term</b> using those numbers.<br>4. <b>Factorise in pairs</b>. The two brackets should match.</p><div class="eg"><b>Example:</b> 3x² + 10x + 8<br>a × c = 24. Numbers that multiply to 24 and add to 10: 4 and 6.<br>Split: 3x² + 4x + 6x + 8<br>Pairs: x(3x + 4) + 2(3x + 4) = (3x + 4)(x + 2)<br>Check: 3x² + 6x + 4x + 8 ✓</div><h4>Algebraic fractions</h4><p>Factorise the top and the bottom completely, then cancel <b>whole brackets</b> that appear on both. Never cancel single terms such as the x’s in (x + 4)/(x + 2).</p><div class="eg">(3x² + 10x + 8)/(x² − 4) = (3x + 4)(x + 2) / (x + 2)(x − 2) = (3x + 4)/(x − 2)<br>(x² − 4 is a difference of two squares: (x + 2)(x − 2).)</div><h4>“Show that”</h4><p>Write the factorising for both parts, then state the final fraction in the form (ax + b)/(cx + d).</p>`,
15:`<h4>The five-number summary</h4><p>A box plot is drawn from five values: least, lower quartile (LQ), median, upper quartile (UQ), greatest. The median splits the data in half; the quartiles split each half in half again.</p><div class="eg"><b>Finding them:</b> 4, 7, 9, 12, 15, 18, 20 (already in order).<br>Median = 12, LQ = 7 (middle of 4, 7, 9), UQ = 18 (middle of 15, 18, 20), least 4, greatest 20.<br>IQR = 18 − 7 = 11. Range = 20 − 4 = 16.</div><h4>Drawing it</h4><p>1. Use a ruler and read the horizontal scale carefully.<br>2. Draw a <b>box from LQ to UQ</b>.<br>3. Draw a vertical line inside the box at the <b>median</b>.<br>4. Draw <b>whiskers</b> from the box out to the <b>least</b> and <b>greatest</b> values, with a small cross-line at each end.</p><h4>Common mistakes</h4><p>Ending the whiskers at the quartiles, putting the median line in the middle of the box instead of at its value, or drawing a bar chart.</p>`,
16:`<h4>The idea</h4><p>To compare two distributions you need <b>two comments</b>: one about the <b>average</b> and one about the <b>spread</b>. Use the numbers, name the groups and say what it means.</p><h4>Average</h4><p>On a box plot the average is the <b>median</b> (the line in the box). Compare the two values.</p><h4>Spread</h4><p>Compare the <b>interquartile ranges</b> (box widths): IQR = UQ − LQ. A bigger IQR means the heights are more varied. You can also compare the ranges, but the IQR is not affected by extreme values.</p><div class="eg"><b>Model sentences:</b> “The median height of Group A (170 cm) is higher than Group B (168 cm), so swimmers are taller on average.” “The IQR of Group A (17 cm) is bigger than Group B (11 cm), so the swimmers’ heights are more spread out.”</div><h4>Common mistakes</h4><p>Just listing numbers without a comparison word (higher, lower, bigger, smaller). Missing “on average”. Mentioning the mean, which a box plot does not show.</p>`,
17:`<h4>Why histograms use frequency density</h4><p>The bars have different widths, so bar height alone would be misleading. A histogram makes the <b>area</b> of each bar equal to its frequency.</p><p><b>Frequency density = frequency ÷ class width</b><br><b>Frequency = frequency density × class width</b></p><div class="eg"><b>Example:</b> class 10 ≤ d ≤ 30 with density 2.5: width 20, so frequency = 2.5 × 20 = 50.<br>Class width 12 with frequency 36: density = 36 ÷ 12 = 3.</div><h4>Completing a histogram</h4><p>Use the given frequency and the width of that class to find the height, then draw the bar between the class boundaries.</p><h4>Total number</h4><p>Find the <b>frequency of every bar</b> (density × width) and <b>add them all up</b>.</p><h4>Common mistakes</h4><p>Reading the vertical axis as frequency. Using the wrong class widths (read the boundaries on the horizontal axis). Leaving a bar out of the total.</p>`,
18:`<h4>Similar shapes</h4><p>Shapes are <b>similar</b> if one is an enlargement of the other: same shape, different size. Matching lengths are all multiplied by the same <b>scale factor k</b>. If a small cone is cut off the top of a large cone, the two cones are similar, so slant height, radius and height are all in the same ratio.</p><div class="eg">Large cone: slant 10, radius 4. Small cone slant 5. Scale factor = 5 ÷ 10 = ½, so the small radius = 4 × ½ = 2.</div><h4>Surface areas you need</h4><p>Curved surface area of a cone = πrl (r radius, l slant height). Circle area = πr².</p><h4>Frustum</h4><p>A frustum is a big cone with a small cone removed. A <b>solid</b> frustum has three surfaces: the curved part, the bottom circle and the top circle.</p><div class="eg">Curved = π(4)(10) − π(2)(5) = 40π − 10π = 30π<br>Bottom = π(4)² = 16π, top = π(2)² = 4π<br>Total = 50π = 157 (3 s.f.)</div><h4>Common mistakes</h4><p>Forgetting the top circle. Using a diameter as a radius (a diameter is twice the radius). Using the wrong ratio for the small radius.</p>`,
19:`<h4>The idea</h4><p>When letters are linked by equations, write them all in terms of <b>one letter</b>, then compare them as a ratio.</p><div class="eg"><b>Example:</b> 3p = 2q and 5r = 2q. Show that p + r : q = 16 : 15.<br>p = 2q/3 and r = 2q/5. Choose q to clear both fractions: q = 15 (the lowest common multiple of 3 and 5).<br>Then p = 10 and r = 6, so p + r = 16.<br>p + r : q = 16 : 15 ✓</div><h4>Steps</h4><p>1. Rearrange each equation to get each letter alone.<br>2. Pick a value for the common letter that gives whole numbers.<br>3. Work out every letter.<br>4. Add them as the question asks (a + b, b + c).<br>5. Write the ratio and state that it matches.</p><h4>Common mistakes</h4><p>Writing the ratio of a : b instead of a + b : b + c, or using a value that leaves fractions.</p>`,
20:`<h4>Bounds</h4><p>A measurement rounded to the nearest unit could really be up to <b>half a unit</b> either side. Nearest mm = 0.1 cm, so the error is ± 0.05 cm. For 7.6 cm: 7.55 ≤ length &lt; 7.65.</p><h4>Trigonometry (SOHCAHTOA)</h4><p>sin x = opposite ÷ hypotenuse. To find the angle use sin⁻¹ on your calculator. In triangle ABC the angle at C has AB opposite and AC as the hypotenuse.</p><h4>Which bounds to use</h4><p>A <b>smaller</b> sin gives a <b>smaller</b> angle. To make a fraction as small as possible, use the <b>smallest top</b> and the <b>largest bottom</b>.</p><div class="eg"><b>Example:</b> opposite 6.0 and hypotenuse 9.0, each to 1 d.p. (error ±0.05). Lower bound: sin x = 5.95 ÷ 9.05 = 0.6575…, so x = sin⁻¹(0.6575…) = 41.1°.</div><h4>Common mistakes</h4><p>Using ±0.5 instead of ±0.05, using the upper bound of the hypotenuse for a lower bound angle, and rounding before the final step.</p>`,
21:`<h4>The idea</h4><p>A recurring decimal goes on forever with a repeating pattern. To turn it into a fraction, use algebra so the repeating part cancels.</p><h4>Method</h4><p>1. Let <b>x</b> = the decimal.<br>2. Multiply by powers of 10 so that the <b>recurring digits line up</b> after the decimal point.<br>3. <b>Subtract</b> the two equations: the recurring part disappears.<br>4. Solve for x and simplify.</p><div class="eg"><b>Pure repeat:</b> x = 0.727272… 100x = 72.7272…, subtract: 99x = 72, x = 72/99 = 8/11.<br><b>With a digit before the repeat:</b> x = 0.1666… 10x = 1.666… and 100x = 16.666…, subtract: 90x = 15, x = 15/90 = 1/6.</div><p>If the pattern has 2 recurring digits, the multiples differ by a factor of 100.</p><h4>Common mistakes</h4><p>Not lining up the recurring parts, not simplifying the fraction, and skipping the “let x =” line in a proof.</p>`,
22:`<h4>Surd rules</h4><p>√a × √a = a, so √5 × √5 = 5. Surds are irrational numbers left in root form. Answers are written as a whole-number part plus a surd part.</p><h4>Squaring a bracket</h4><p>(a + b)² means (a + b)(a + b). It is <b>not</b> a² + b²: there is a middle term 2ab.</p><div class="eg">(2 + √3)² = 4 + 2√3 + 2√3 + 3 = 7 + 4√3<br>(√3 − 1)² = 3 − √3 − √3 + 1 = 4 − 2√3</div><h4>Area</h4><p>Area of a square = side². For a shape with a corner removed: <b>large area − small area</b>. Put the second area in brackets when you subtract so every sign changes.</p><div class="eg">(7 + 4√3) − (4 − 2√3) = 7 + 4√3 − 4 + 2√3 = 3 + 6√3</div><h4>Common mistakes</h4><p>Missing the middle terms, forgetting to change signs when subtracting, and writing √5 × √5 = 25.</p>`,
23:`<h4>The idea</h4><p>To simplify a surd, split it into a <b>square number × another number</b>, then take the root of the square number: √(ab) = √a × √b.</p><div class="eg">√48 = √(16 × 3) = √16 × √3 = 4√3<br>√72 = √(36 × 2) = 6√2 (use the <b>largest</b> square factor)</div><h4>Adding surds</h4><p>You can only add or subtract <b>like surds</b> (same number under the root), just like 2x + 3x = 5x.</p><div class="eg">√50 + √8 = 5√2 + 2√2 = 7√2</div><h4>Common mistakes</h4><p>Thinking √12 + √27 = √39 (you cannot add numbers under roots), or stopping before the surd is fully simplified.</p>`,
24:`<h4>The idea</h4><p>Same method as Q13 but one bracket has a number in front of x, so watch the coefficients and signs.</p><div class="eg"><b>Example:</b> (3x + 1)(x + 2)(x − 1)<br>Expand the two easiest brackets first: (x + 2)(x − 1) = x² + x − 2<br>Multiply by (3x + 1): 3x(x² + x − 2) + 1(x² + x − 2) = 3x³ + 3x² − 6x + x² + x − 2<br>Collect like terms: 3x³ + 4x² − 5x − 2</div><h4>Check</h4><p>Put x = 1 into both: (4)(3)(0) = 0 and 3 + 4 − 5 − 2 = 0 ✓</p><h4>Common mistakes</h4><p>Multiplying only the first term of a bracket, sign errors with negatives, and not writing the answer in the form ax³ + bx² + cx + d (highest power first).</p>`};

function pyth(){return `<svg viewBox="0 0 360 180" class="fig"><path d="M60 90V150H204Z" class="l"/><path d="M60 138H72V150" class="l"/><text x="52" y="124" class="lb" text-anchor="end">5</text><text x="132" y="168" class="lb" text-anchor="middle">12</text><text x="146" y="108" class="lb">13 (hypotenuse)</text><text x="225" y="140" class="lb">5² + 12² = 13²</text><text x="225" y="158" class="lb">25 + 144 = 169</text></svg>`}
